
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  >

  <meta name="theme-color" content="#090713">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <meta
    name="description"
    content="APPARA CHESS — The Royal Chess Experience. Enter a premium 3D chess world."
  >

  <title>APPARA CHESS — The Royal Chess Experience</title>

  <!-- APP ICON -->
  <link rel="icon" href="./icons/app-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/app-icon.svg">

  <!-- PWA MANIFEST -->
  <link rel="manifest" href="./manifest.json">

  <!-- PRECONNECT -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- PREMIUM TYPOGRAPHY -->
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <!-- THREE.JS IMPORT MAP -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
      }
    }
  </script>

  <!-- MAIN STYLESHEETS -->
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/screens.css">
  <link rel="stylesheet" href="./css/chess-arena.css">
  <link rel="stylesheet" href="./css/3d-effects.css">
  <link rel="stylesheet" href="./css/responsive.css">

</head>

<body>

  <!-- ======================================
       APPLICATION ROOT
  ======================================= -->

  <div id="app" class="app-container">

    <!-- LOADING SCREEN -->

    <section id="loading-screen" class="loading-screen">

      <div class="loading-content">

        <div class="loading-logo">
          <span class="loading-crown">♛</span>
        </div>

        <h1>APPARA CHESS</h1>

        <p>THE ROYAL CHESS EXPERIENCE</p>

        <div class="loading-progress">
          <div class="loading-progress-bar"></div>
        </div>

        <span class="loading-status">
          Preparing the Royal Chess World...
        </span>

      </div>

    </section>

    <!-- MAIN APPLICATION VIEW -->

    <main id="app-view" class="app-view">

      <!-- Screens are rendered by the application router -->

      <div id="screen-container"></div>

    </main>

    <!-- GLOBAL MODAL ROOT -->

    <div
      id="modal-root"
      class="modal-root"
      aria-live="polite"
    ></div>

    <!-- GLOBAL TOAST ROOT -->

    <div
      id="toast-root"
      class="toast-root"
      aria-live="polite"
      aria-atomic="true"
    ></div>

  </div>

  <!-- ======================================
       APPLICATION STARTUP
  ======================================= -->

  <script type="module" src="./js/app.js"></script>

  <!-- ======================================
       SERVICE WORKER REGISTRATION
  ======================================= -->

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("./sw.js")
          .catch((error) => {
            console.error(
              "APPARA CHESS service worker registration failed:",
              error
            );
          });
      });
    }
  </script>

</body>
</html>

<!-- ======================================
     APPARA CHESS — FILE 80 COMPLETE
======================================= -->
