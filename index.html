<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#090713">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <meta
    name="description"
    content="APPARA CHESS — The Royal Chess Experience. Enter a premium chess world."
  >

  <title>APPARA CHESS — The Royal Chess Experience</title>

  <!-- APP ICON -->
  <link
    rel="icon"
    href="./icons/app-icon.svg"
    type="image/svg+xml"
  >

  <link
    rel="apple-touch-icon"
    href="./icons/app-icon.svg"
  >

  <!-- PWA MANIFEST -->
  <link
    rel="manifest"
    href="./manifest.json"
  >

  <!-- FONT CONNECTIONS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <!-- PREMIUM FONTS -->
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <!-- MODULE IMPORT MAP -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
      "chess.js": "https://cdn.jsdelivr.net/npm/chess.js@1.4.0/dist/esm/chess.js",

      "firebase/app": "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js",
      "firebase/storage": "https://www.gstatic.com/firebasejs/10.12.5/firebase-storage.js",
      "firebase/functions": "https://www.gstatic.com/firebasejs/10.12.5/firebase-functions.js"
    }
  }
  </script>

  <!-- MAIN STYLESHEET -->
  <link rel="stylesheet" href="./css/style.css">

  <!-- SCREEN STYLESHEETS -->
  <link rel="stylesheet" href="./css/screens.css">
  <link rel="stylesheet" href="./css/chess-arena.css">
  <link rel="stylesheet" href="./css/3d-effects.css">
  <link rel="stylesheet" href="./css/responsive.css">

</head>

<body>

  <!-- APPLICATION ROOT -->
  <div id="app" class="app-container">

    <!-- LOADING SCREEN -->
    <section
      id="loading-screen"
      class="loading-screen"
      aria-live="polite"
    >

      <div class="loading-content">

        <div class="loading-logo">
          <span class="loading-crown">♛</span>
        </div>

        <h1>APPARA CHESS</h1>

        <p>THE ROYAL CHESS EXPERIENCE</p>

        <div class="loading-progress">
          <div class="loading-progress-bar"></div>
        </div>

        <span class="loading-status">
          Preparing the Royal Chess World...
        </span>

      </div>

    </section>

    <!-- MAIN APPLICATION -->
    <main
      id="app-view"
      class="app-view"
    >

      <div id="screen-container"></div>

    </main>

    <!-- MODAL ROOT -->
    <div
      id="modal-root"
      class="modal-root"
      aria-live="polite"
    ></div>

    <!-- TOAST ROOT -->
    <div
      id="toast-root"
      class="toast-root"
      aria-live="polite"
      aria-atomic="true"
    ></div>

  </div>

  <!-- MAIN APPLICATION SCRIPT -->
  <script
    type="module"
    src="./js/app.js"
  ></script>

  <!-- SERVICE WORKER -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {

        navigator.serviceWorker
          .register("./sw.js")
          .catch(error => {
            console.error(
              "APPARA CHESS service worker registration failed:",
              error
            );
          });

      });
    }
  </script>

</body>
</html>
