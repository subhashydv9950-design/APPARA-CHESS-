<svg xmlns="http://www.w3.org/2000/svg"
     width="512"
     height="512"
     viewBox="0 0 512 512">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#241044"/>
      <stop offset="55%" stop-color="#10091f"/>
      <stop offset="100%" stop-color="#05030b"/>
    </linearGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#fff1ad"/>
      <stop offset="35%" stop-color="#eac45c"/>
      <stop offset="70%" stop-color="#bd8730"/>
      <stop offset="100%" stop-color="#fff0a0"/>
    </linearGradient>

    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a56aff"/>
      <stop offset="100%" stop-color="#5520a0"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="shadow">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Outer royal border -->
  <rect x="17" y="17" width="478" height="478" rx="100"
        fill="none" stroke="url(#gold)" stroke-width="5"/>

  <rect x="29" y="29" width="454" height="454" rx="90"
        fill="none" stroke="#a66cff" stroke-opacity=".35"
        stroke-width="2"/>

  <!-- Background royal glow -->
  <circle cx="256" cy="222" r="155"
          fill="#762bd2" opacity=".16" filter="url(#glow)"/>

  <!-- Chessboard base -->
  <ellipse cx="256" cy="405" rx="155" ry="25"
           fill="#000000" opacity=".65" filter="url(#shadow)"/>

  <path d="M112 350 L256 307 L400 350 L256 397 Z"
        fill="#171020" stroke="url(#gold)" stroke-width="4"/>

  <path d="M145 350 L256 319 L367 350 L256 382 Z"
        fill="url(#purple)" opacity=".55"/>

  <path d="M256 319 L256 382 M200 334 L200 365 M312 334 L312 365"
        stroke="#f3d783" stroke-opacity=".45" stroke-width="2"/>

  <!-- Central chess knight silhouette -->
  <g filter="url(#glow)">
    <path d="
      M190 326
      L205 291
      L194 263
      L207 228
      L196 195
      L213 151
      L249 113
      L289 105
      L321 128
      L331 158
      L311 185
      L296 206
      L310 235
      L327 263
      L321 302
      L344 326
      Z"
      fill="url(#gold)"
      stroke="#fff0ae"
      stroke-width="5"
      stroke-linejoin="round"/>

    <!-- Knight mane -->
    <path d="M215 153 L235 177 L222 199 L245 216
             L230 238 L258 252 L281 225"
          fill="none" stroke="#8b5a20" stroke-width="7"
          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Eye -->
    <circle cx="284" cy="145" r="8" fill="#241044"/>
    <circle cx="286" cy="143" r="3" fill="#ffffff"/>

    <!-- Neck detail -->
    <path d="M255 259 L294 282 L286 309"
          fill="none" stroke="#8b5a20" stroke-width="7"
          stroke-linecap="round"/>

    <!-- Base -->
    <path d="M178 326 L356 326 L370 347
             L164 347 Z"
          fill="url(#gold)" stroke="#fff0ae" stroke-width="3"/>
  </g>

  <!-- Crown accent -->
  <g fill="url(#gold)" stroke="#fff0ae" stroke-width="3">
    <path d="M215 91 L229 61 L254 82 L279 55
             L296 88 L317 69 L309 108 L222 108 Z"/>
    <circle cx="229" cy="60" r="6"/>
    <circle cx="279" cy="54" r="6"/>
    <circle cx="317" cy="68" r="6"/>
  </g>

  <!-- Small royal stars -->
  <g fill="#fff0ae">
    <path d="M105 143 L111 158 L127 164 L111 170 L105 186
             L99 170 L83 164 L99 158 Z"/>
    <path d="M391 190 L396 202 L409 207 L396 212 L391 225
             L386 212 L373 207 L386 202 Z"/>
    <circle cx="135" cy="250" r="4"/>
    <circle cx="375" cy="275" r="4"/>
  </g>

  <!-- APPARA label -->
  <text x="256" y="442"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="31"
        font-weight="bold"
        letter-spacing="5"
        fill="url(#gold)">APPARA</text>

  <text x="256" y="468"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="13"
        letter-spacing="6"
        fill="#e8d7ff">CHESS</text>

</svg>

<!-- FILE 82 END -->
